name: Daily Job Application Agent

on:
  schedule:
    # 03:30 UTC is 09:00 AM IST every day
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Execute Daily Job Discovery & Matching Pipeline
        env:
          APP_ENV: production
          MIN_MATCH_SCORE: 70
        run: |
          python scheduler/daily_job.py --run-now

      - name: Upload Daily Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-reports
          path: reports/daily_report_*.md
          retention-days: 14

      - name: Commit and Push Updated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily job report [skip ci]" && git push)
